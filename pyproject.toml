[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voc-campaign-intelligence"
version = "1.0.0"
description = "Evidence-backed voice-of-customer insights and marketing briefs using synthetic data."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.20,<1",
  "streamlit>=1.50,<2", "pandas>=2.2,<4", "scikit-learn>=1.6,<2",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1.0,<2",
  "altair>=5.5,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "playwright>=1.49,<2"]

[tool.setuptools.packages.find]
include = ["voc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
